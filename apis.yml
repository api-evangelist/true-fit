aid: true-fit
name: True Fit
description: 'True Fit Corporation is an AI-powered fit and sizing intelligence platform
  for apparel and footwear ecommerce. Its Fashion Genome dataset is built on roughly
  two decades of real purchase-and-return outcomes across 100M+ registered shoppers,
  60M unique products and 91K+ brands, and powers size recommendations, fit confidence
  scores, cross-brand size calibration and shopper fit profiles. True Fit ships as a
  product-detail-page JavaScript widget, a Shopify app, native iOS/Android/React Native
  SDKs, a documented Partner REST API and Consumer REST API, a 360 Member View data
  API, and a Fit Intelligence Layer exposed to AI agents over the Model Context Protocol.'
image: https://cdn.prod.website-files.com/64ee50f98275d03e3242bdef/69d410679088692a9df73243_256px%20webclip.png
url: https://raw.githubusercontent.com/api-evangelist/true-fit/refs/heads/main/apis.yml
