apis:
- aid: true-fit:partner-api
  name: True Fit Partner API
  description: 'Server-to-server REST API for managing True Fit profiles on behalf of
    your own users and requesting size recommendations for retailer products. Covers
    identity sync, profiles, body measurements, closet items, bulk size recommendations
    for up to 100 products, and anonymous aggregate general guidance. HTTP Basic auth
    with an empty username and the partner API key as the password; GET /id-sync is
    signed with HMAC-SHA256.'
  humanURL: https://techdocs.truefitcorp.com/reference/partner-overview
  baseURL: https://partner.truefitcorp.com/api
  tags:
  - Recommendations
  - Profiles
  - Measurements
  - Closet
  - Identity
  properties:
  - type: OpenAPI
    url: openapi/true-fit-partner-api-openapi.json
  - type: Overlay
    url: overlays/true-fit-partner-api-overlay.yaml
  - type: APIReference
    url: https://techdocs.truefitcorp.com/reference/partner-overview
  - type: Documentation
    url: https://techdocs.truefitcorp.com/reference/partner-overview
- aid: true-fit:consumer-api
  name: True Fit Consumer API
  description: 'Browser/device-facing REST API used to build a custom True Fit integration:
    session tokens, shopper profiles and recipient profiles, closet items, brands,
    sizes, bra sizes, inseams, sleeve lengths, style attributes, products, normalized
    sizes, fit recommendations, product ratings, checkout tracking and analytics.
    Requests are identified by a rotating token passed as a header; the API relies on
    third-party cookies and withCredentials for cross-site recommendations.'
  humanURL: https://techdocs.truefitcorp.com/reference/registration-api
  baseURL: https://fitrec.truefitcorp.com/profile/public/v3
  tags:
  - Profiles
  - Recommendations
  - Closet
  - Brands
  - Sizes
  properties:
  - type: OpenAPI
    url: openapi/true-fit-consumer-api-openapi.json
  - type: Overlay
    url: overlays/true-fit-consumer-api-overlay.yaml
  - type: APIReference
    url: https://techdocs.truefitcorp.com/reference
  - type: Documentation
    url: https://techdocs.truefitcorp.com/docs/overview-1
- aid: true-fit:360-member-view-api
  name: True Fit 360 Member View API
  description: 'Two-endpoint data API that packages True Fit machine-learning assets
    for a retailer partner: a Metadata endpoint returning the descriptor of the current
    weekly 360 Member View file (client id, created timestamp, OpenPGP algorithm, SHA-256
    of the plaintext) and a Content endpoint streaming the encrypted newline-delimited
    JSON file of shopper registration, likely-brand and likely-size predictions. Authorized
    with an "Authorization: sha256 API_KEY" header issued during onboarding.'
  humanURL: https://techdocs.truefitcorp.com/docs/overview-2
  baseURL: https://true-360.truefitcorp.com/true-360/public/v1
  tags:
  - Data
  - Analytics
  - Personalization
  properties:
  - type: Documentation
    url: https://techdocs.truefitcorp.com/docs/overview-2
  - type: APIReference
    url: https://techdocs.truefitcorp.com/docs/supported-apis
