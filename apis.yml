apis:
- aid: true-fit:360-member-view-api
  name: True Fit 360 Member View API
  description: >-
    Two-endpoint data API that packages True Fit machine-learning assets for a retailer partner: a Metadata
    endpoint returning the descriptor of the current weekly 360 Member View file (client id, created timestamp,
    OpenPGP algorithm, SHA-256 of the plaintext) and a Content endpoint streaming the encrypted newline-delimited
    JSON file of shopper registration, likely-brand and likely-size predictions. Authorized with an "Authorization:
    sha256 API_KEY" header issued during onboarding.
  humanURL: https://techdocs.truefitcorp.com/docs/overview-2
  baseURL: https://true-360.truefitcorp.com/true-360/public/v1
  tags:
  - Data
  - Analytics
  - Personalization
  properties:
  - type: Documentation
