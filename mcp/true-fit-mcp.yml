spec_page: https://www.truefit.com/fit-intelligence-spec
description: >-
  True Fit publicly markets a "Fit Intelligence Layer via MCP" as one of its activation
  paths, described in section 7 of its own technical specification. NO public MCP endpoint,
  tools/list manifest, registry entry or connection instructions were discoverable — the
  MCP layer is arranged through sales ("Get a Demo"). The tools below are DERIVED from the
  published Partner API operations as a candidate surface; they are NOT True Fit's
  published tool names and must not be read as such.
server:
  name: true-fit-fit-intelligence
  published: false
  url: null
  transport: unknown
  access: sales-gated
  probes:
  - {url: 'https://mcp.truefit.com/', result: NXDOMAIN}
  - {url: 'https://mcp.truefitcorp.com/mcp', result: NXDOMAIN}
  - {url: 'https://partner.truefitcorp.com/mcp', http_status: 404}
  - {url: 'https://fitrec.truefitcorp.com/mcp', http_status: 404}
provider_stated_capabilities:
  source: https://www.truefit.com/fit-intelligence-spec
  capabilities:
  - Integration of fit intelligence into AI agents and shopping assistants
  - Programmatic access to fit recommendations and shopper fit context from any
    MCP-compatible system
  - Standardized fit guidance across PDP, conversational agents, site search, customer
    support, returns and exchange flows, PLP size filtering and inventory workflows
  security_model:
    authentication: scoped tokens and role-based access control
    data_minimization: agents receive only size recommendations and fit confidence scores,
      not underlying shopper data
    auditability: end-to-end encryption, audit logging, real-time monitoring
    revocability: access can be revoked or scoped at any time
